version: "3"

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: always
    ports:
      - 9870:9870
      - 9010:9000
    volumes:
      - "./docker_config/namenode:/hadoop/dfs/name"
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    env_file:
      - ./src/conf_hadoop/hadoop.env
    networks:
      - bigdata-network

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: always
    volumes:
      - "./docker_config/datanode:/hadoop/dfs/data"
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
    ports:
      - "9864:9864"
    env_file:
      - ./src/conf_hadoop/hadoop.env
    networks:
      - bigdata-network

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    restart: always
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864"
    env_file:
      - ./src/conf_hadoop/hadoop.env
    networks:
      - bigdata-network

  nodemanager1:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager
    restart: always
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088"
    env_file:
      - ./src/conf_hadoop/hadoop.env
    networks:
      - bigdata-network

  historyserver:
    image: bde2020/hadoop-historyserver:2.0.0-hadoop3.2.1-java8
    container_name: historyserver
    restart: always
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088"
    volumes:
      - "./docker_config/historyserver:/hadoop/yarn/timeline"
    env_file:
      - ./src/conf_hadoop/hadoop.env
    networks:
      - bigdata-network

  spark-master:
    image: bde2020/spark-master:3.0.0-hadoop3.2
    container_name: spark-master
    depends_on:
      - namenode
      - datanode
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - INIT_DAEMON_STEP=setup_spark
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - ./data:/source
      - ./src/persistant:/opt/pipeline
      - ./spark/jars:/opt/spark/jars
      - ./src/conf_spark/spark-defaults.conf:/spark/conf/spark-defaults.conf
    networks:
      - bigdata-network

  spark-worker-1:
    image: bde2020/spark-worker:3.0.0-hadoop3.2
    container_name: spark-worker-1
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    environment:
      - "SPARK_MASTER=spark://spark-master:7077"
      - "CORE_CONF_fs_defaultFS=hdfs://namenode:9000"
      - "SPARK_WORKER_CORES=2"
      - "SPARK_WORKER_MEMORY=1g"
    volumes:
      - ./data:/app/data
      - ./data:/source 
      - ./lakehouse:/lakehouse
      - ./spark/jars:/opt/spark/jars
      - ./src/conf_spark/spark-defaults.conf:/spark/conf/spark-defaults.conf
    networks:
      - bigdata-network

  spark-worker-2:
    image: bde2020/spark-worker:3.0.0-hadoop3.2
    container_name: spark-worker-2
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    environment:
      - "SPARK_MASTER=spark://spark-master:7077"
      - "CORE_CONF_fs_defaultFS=hdfs://namenode:9000"
      - "SPARK_WORKER_CORES=2"
      - "SPARK_WORKER_MEMORY=1g"
    volumes:
      - ./data:/app/data
      - ./lakehouse:/lakehouse
      - ./data:/source
      - ./spark/jars:/opt/spark/jars
      - ./src/conf_spark/spark-defaults.conf:/spark/conf/spark-defaults.conf
    networks:
      - bigdata-network

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    depends_on:
      - namenode
      - datanode
      - hive-metastore-postgresql
    env_file:
      - ./src/conf_hadoop/hadoop-hive.env
    environment:
      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore-postgresql/metastore"
      SERVICE_PRECONDITION: "hive-metastore:9083"
    ports:
      - "10000:10000"
    networks:
      - bigdata-network

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    env_file:
      - ./src/conf_hadoop/hadoop-hive.env
    command: /opt/hive/bin/hive --service metastore
    environment:
      SERVICE_PRECONDITION: "namenode:9870 datanode:9864 hive-metastore-postgresql:5432"
    ports:
      - "9083:9083"
    depends_on:
      - hive-metastore-postgresql
    networks:
      - bigdata-network

  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: hive-metastore-postgresql
    ports:
      - "5433:5433"
    volumes:
      - "./docker_config/hive-postgresql:/var/lib/postgresql/data"
    networks:
      - bigdata-network

  postgres:
    image: postgres:15-alpine
    container_name: postgres-instagram
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: instagram_db
    ports:
      - "5431:5431"
    volumes:
      - "./docker_config/postgres:/var/lib/postgresql/data"
      - "./init-scripts:/docker-entrypoint-initdb.d"
    networks:
      - bigdata-network

  presto-coordinator:
    image: shawnzhu/prestodb:0.181
    container_name: presto-coordinator
    ports:
      - "8089:8089"
    networks:
      - bigdata-network

networks:
  bigdata-network:
    driver: bridge